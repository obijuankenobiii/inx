<!doctype html>
<html lang="en">
<head><meta name="view-transition" content="same-origin"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Inx — Trash</title>
  <style>
    .page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:0 0 18px;max-width:1240px}
    .page-header h1{font:600 22px/1.2 var(--font-sans);letter-spacing:-.02em;margin:0}
    .action-btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;
      border:1px solid var(--ink);border-radius:0;padding:8px 14px;color:var(--ink);background:transparent;
      cursor:pointer;font-size:14px;font-weight:700;white-space:nowrap;
    }
    .action-btn:hover{background:var(--soft)}
    .action-btn:disabled{opacity:.35;cursor:not-allowed}
    .action-btn svg{width:18px;height:18px;flex:0 0 auto}
    .workspace{max-width:1240px;margin:0 auto}
    .contents-header{
      display:grid;grid-template-columns:minmax(0,1fr) 140px 150px 72px;align-items:center;gap:12px;
      padding:0 8px 10px;border-bottom:1px solid var(--line);
    }
    .column-heading{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .file-list{padding:2px 0 20px}
    .file-row{
      min-height:58px;display:grid;grid-template-columns:minmax(0,1fr) 140px 150px 72px;align-items:center;gap:12px;
      padding:0 8px;border-bottom:1px solid transparent;
    }
    .file-row:hover,.file-row.selected{background:var(--active)}
    .row-main{min-width:0;display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;cursor:default}
    .row-main .icon{width:22px;height:22px;flex:0 0 auto}
    .is-folder .row-main .icon{width:24px;height:24px}
    .name{min-width:0;flex:1;font-size:15px;font-weight:700;overflow-wrap:anywhere}
    .row-contents,.row-updated{color:var(--muted);font-size:14px}
    .row-actions{display:flex;align-items:center;justify-content:flex-end}
    .row-action{
      width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:0;border-radius:0;
      background:transparent;color:#817b70;cursor:pointer;
    }
    .row-action:hover{background:var(--soft);color:var(--ink)}
    .row-action svg{width:18px;height:18px}
    .more-menu{position:fixed;min-width:200px;padding:6px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 28px rgba(36,35,33,.16);z-index:40}
    .more-menu button{
      display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border:0;background:transparent;
      color:var(--ink);cursor:pointer;text-align:left;font-weight:600;font-size:14px;
    }
    .more-menu button:hover{background:var(--soft)}
    .more-menu button.danger{color:#8e332d}
    .empty-state{color:var(--muted);text-align:center;padding:52px 20px;font-size:15px}
    .toast{
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
      padding:10px 16px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:1000;
    }
    .toast.show{opacity:1}
    .modal-overlay{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:18px;background:rgba(36,35,33,.42);z-index:50}
    .modal-overlay.open{display:flex}
    .modal{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);padding:22px}
    .modal h2{font:600 18px/1.2 var(--font-sans);margin:0 0 10px}
    .modal p{font-size:14px;color:#4a4742;line-height:1.5;margin:0 0 18px}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px}
    .modal-btn{height:40px;padding:0 16px;border:1px solid var(--ink);background:transparent;font:700 13px/1 var(--font-sans);cursor:pointer}
    .modal-btn.primary{background:var(--ink);color:#fff}
    .modal-btn.danger{background:#7e322b;border-color:#7e322b;color:#fff}
    @media(max-width:800px){
      .contents-header,.file-row{grid-template-columns:minmax(0,1fr) 72px}
      .row-contents,.row-updated,.column-heading:nth-child(2),.column-heading:nth-child(3){display:none}
    }
  </style>
<style id="inx-shell-css">
@view-transition{navigation:auto}
:root{
  --paper:#f7f5f0;--sidebar:#f3f1ec;--panel:#fffdfa;--ink:#242321;--muted:#77736c;
  --line:#dedbd3;--soft:#ebe7dd;--active:#e7e2d7;--blue:#2559f4;--blue-hover:#1142d4;--radius:2px;
  --color-highlighter-orange:#ff9f47;--danger:#8e332d;
  --font-sans:"Source Sans 3",system-ui,sans-serif;
  --font-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sidebar-w:250px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--font-sans);line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit}
a{color:inherit}

.inx-app-shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr)}
.inx-sidebar{
  position:sticky;top:0;align-self:start;height:100vh;max-height:100vh;
  background:var(--sidebar);border-right:1px solid var(--line);
  padding:26px 14px 14px;display:flex;flex-direction:column;gap:6px;overflow:hidden;
  view-transition-name:inx-sidebar;
}
::view-transition-old(inx-sidebar),
::view-transition-new(inx-sidebar){animation:none;mix-blend-mode:normal;height:100%}
.inx-brand{
  display:flex;align-items:center;gap:10px;padding:2px 12px 22px;text-decoration:none;color:var(--ink);
  font:600 23px/1 var(--font-sans);letter-spacing:-.045em;text-transform:lowercase;
}
.inx-brand .inx-mark{width:26px;height:26px;display:block;flex:0 0 auto}
.inx-side-nav{display:grid;gap:3px}
.inx-side-nav a,.inx-settings-link{
  display:flex;align-items:center;gap:12px;min-height:42px;padding:9px 12px;border-radius:var(--radius);
  text-decoration:none;font-size:15px;font-weight:500;color:var(--ink);
}
.inx-side-nav a:hover,.inx-settings-link:hover{background:var(--soft)}
.inx-side-nav a.active,.inx-settings-link.active{background:var(--active)}
.inx-side-nav svg,.inx-settings-link svg,.inx-recents-list svg{
  width:22px;height:22px;flex:0 0 auto;display:block;shape-rendering:geometricPrecision;
}
.inx-recents{margin-top:14px;padding:0 4px;min-height:0;overflow:auto}
.inx-recents-toggle{
  width:100%;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:8px 8px 6px;cursor:pointer;
}
.inx-recents-list{display:grid;gap:2px}
.inx-recents-list a{
  display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--radius);text-decoration:none;
  font-size:13px;font-weight:600;color:var(--ink);min-width:0;
}
.inx-recents-list a:hover{background:var(--soft)}
.inx-recents-list span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inx-recents-empty{padding:6px 8px 10px;font-size:12px;color:var(--muted)}
.inx-sidebar-end{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:10px}
.inx-corner-tray{
  position:fixed;right:18px;bottom:18px;z-index:50;width:auto;height:48px;display:flex;align-items:center;
  justify-content:center;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 6px 24px #24232118;
}
.inx-tray-btn{
  position:relative;width:40px;height:40px;border:0;border-radius:var(--radius);background:transparent;color:var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;
}
.inx-tray-btn:hover{background:var(--soft)}
.inx-tray-btn svg{width:20px;height:20px}
.inx-tray-tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;
  padding:6px 10px;border-radius:var(--radius);background:var(--ink);color:#fff;font-size:12px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .12s;
}
.inx-tray-btn:hover .inx-tray-tip,.inx-tray-btn:focus-visible .inx-tray-tip{opacity:1}

.inx-main{min-width:0;padding:28px clamp(22px,4vw,52px) 56px}
.inx-page-title{font:600 22px/1.2 var(--font-sans);letter-spacing:-.02em;margin:0 0 20px;color:var(--ink);font-weight:600}

/* Secondary legacy .container pages */
body.inx-shared .container{
  max-width:none;min-height:100vh;margin:0;padding:0;
  display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);
}
body.inx-shared .container>.inx-sidebar{grid-column:1;grid-row:1 / span 40}
body.inx-shared .header{
  grid-column:2;text-align:left;margin:0;padding:28px clamp(22px,4vw,52px) 0;background:var(--paper);border:0;
}
body.inx-shared .header h1{font:600 22px/1.2 var(--font-sans);letter-spacing:-.02em;color:var(--ink)}
body.inx-shared .nav-links{display:none!important}
body.inx-shared .container>:not(.inx-sidebar):not(.header){
  grid-column:2;max-width:1080px;width:100%;padding:18px clamp(22px,4vw,52px) 56px;background:var(--paper);
}
body.inx-shared .card,body.inx-shared .panel,body.inx-shared .stage{
  border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important;backdrop-filter:none;
  padding:0!important;margin:0 0 28px!important;
}
body.inx-shared .settings-section{
  border:1px solid var(--line);border-radius:0;box-shadow:none;background:var(--panel);backdrop-filter:none;
}
body.inx-shared .tabs{justify-content:flex-start;gap:8px;margin:0 0 18px;padding:0}
body.inx-shared .tab-btn{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);font-weight:600;
  padding:8px 16px;font-size:14px;
}
body.inx-shared .tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
body.inx-shared input,body.inx-shared select,body.inx-shared .btn,body.inx-shared .add-btn,body.inx-shared .action-btn,
body.inx-shared .new-tag-input,body.inx-shared .search,body.inx-shared .tag-input,body.inx-shared .icon-btn{
  border-radius:var(--radius)!important;font-family:var(--font-sans)!important;
}
body.inx-shared .btn.primary,body.inx-shared .btn-primary,body.inx-shared .add-btn{background:var(--ink);color:#fff;border-radius:var(--radius)}
body.inx-shared .action-btn{border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:700}
body.inx-shared .action-btn:hover{background:var(--soft)}
body.inx-shared .action-btn.icon-only-action,body.inx-shared .icon-only-action{
  border:0!important;background:transparent!important;box-shadow:none!important;
}
body.inx-shared .action-btn.icon-only-action:hover,body.inx-shared .icon-only-action:hover{
  background:transparent!important;opacity:.72;
}
body.inx-shared .primary-action,body.inx-shared .action-btn.primary-action{background:var(--blue);color:#fff;border-color:var(--blue)}
body.inx-shared .toast{border-radius:var(--radius)}
body.inx-shared .tag-pill{border-radius:var(--radius)!important;background:var(--soft)!important}
body.inx-shared .toggle-slider{border-radius:var(--radius)}
body.inx-shared .toggle-slider:before{border-radius:1px}
body.inx-shared input:checked+.toggle-slider{background:var(--ink)}
body.inx-shared .setting-item{border-bottom:1px solid var(--line)!important;padding:14px 18px!important}
body.inx-shared .section-header{padding:16px 18px 8px!important}
body.inx-shared .section-header h3{font:600 16px/1.2 var(--font-sans)!important;color:var(--ink)!important}
body.inx-shared .setting-label,.inx-shared .title,.inx-shared .book-title{font-family:var(--font-sans)!important;color:var(--ink)!important}
body.inx-shared .header{border:0!important}
body.inx-shared .toolbar .title{font:600 16px/1.2 var(--font-sans)}
body.inx-shared .summary{color:var(--muted)!important}

.inx-drawer-backdrop[hidden],
.inx-drawer[hidden]{
  display:none!important;
}
.inx-drawer-backdrop{
  display:block;position:fixed;inset:0;z-index:60;
  background:rgba(33,30,28,.72);
  opacity:0;pointer-events:none;
  transition:opacity .22s cubic-bezier(0,0,.2,1);
}
.inx-drawer-backdrop.is-open{
  opacity:1;pointer-events:auto;
}
.inx-drawer{
  display:flex;position:fixed;top:0;right:0;width:40vw;min-width:min(360px,100vw);max-width:720px;
  height:100vh;background:var(--panel);border-left:1px solid var(--line);z-index:70;
  padding:28px 40px 40px;overflow:auto;flex-direction:column;text-align:left!important;
  box-shadow:-18px 0 56px rgba(33,30,28,.38),-4px 0 18px rgba(33,30,28,.16);
  transform:translateX(100%);pointer-events:none;
  transition:transform .28s cubic-bezier(0,0,.2,1);
}
.inx-drawer.is-open{
  transform:translateX(0);pointer-events:auto;
}
.inx-drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px;text-align:left!important}
.inx-drawer-tabs{display:flex;gap:28px;justify-content:flex-start;flex:1}
.inx-drawer-tabs button{
  border:0;background:transparent;padding:8px 0;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;text-align:left;
}
.inx-drawer-tabs button.active{color:var(--ink);border-bottom-color:var(--blue)}
.inx-drawer-close{
  width:36px;height:36px;border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;
  color:var(--muted);flex:0 0 auto;z-index:2;position:relative;
}
.inx-drawer-close:hover{color:var(--ink)}
.inx-drawer-body,.inx-drawer-body *{text-align:left!important}
.inx-drawer-body{display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:0;min-height:120px;color:var(--ink)}
.inx-update{padding:0 0 28px;margin:0 0 28px;border-bottom:1px solid var(--line)}
.inx-update:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.inx-update-title{font:400 32px/1.2 var(--font-serif)!important;letter-spacing:-.02em;margin:0 0 10px;color:var(--ink)}
.inx-update-date{font-size:13px;color:var(--muted);margin:0 0 12px}
.inx-update p{font-size:15px;color:#4a4742;line-height:1.55;margin:0;max-width:36em}

@media(max-width:900px){
  .inx-app-shell,body.inx-shared .container{display:block}
  .inx-sidebar{
    position:relative;height:auto;max-height:none;padding:14px 12px;border-right:0;border-bottom:1px solid var(--line);
  }
  .inx-brand{padding:0 4px 10px;font-size:20px}
  .inx-brand .inx-mark{width:22px;height:22px}
  .inx-side-nav{display:flex;overflow:auto;gap:4px}
  .inx-side-nav a{min-height:38px;white-space:nowrap;font-size:14px}
  .inx-recents,.inx-sidebar-end .inx-settings-link span{display:none}
  .inx-sidebar-end{border-top:0;padding-top:0;display:flex;align-items:center;gap:8px}
  .inx-corner-tray{right:12px;bottom:12px}
  .inx-main,body.inx-shared .container>:not(.inx-sidebar):not(.header){padding:20px 16px 48px}
  body.inx-shared .header{padding:18px 16px 0}
  .inx-page-title,body.inx-shared .header h1{font-size:20px;margin-bottom:14px}
}

/* Device identity (Settings) */
.identity-section{padding-bottom:8px}
.identity-section .section-header{align-items:center}
.identity-section .field{display:grid;gap:6px;margin-bottom:14px;padding:0 24px}
.identity-section .field label{font-size:13px;font-weight:600;color:var(--muted)}
.identity-section .field input{
  width:100%;min-height:40px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);
  padding:8px 12px;
}
.identity-section .segmented{
  display:flex;gap:4px;margin:0 24px 14px;padding:3px;background:var(--soft);border-radius:var(--radius);
}
.identity-section .segmented button{
  flex:1;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:2px;
  font-size:13px;font-weight:600;cursor:pointer;
}
.identity-section .segmented button.active{background:var(--ink);color:#fff}
.identity-section .dropzone{
  display:block;margin:0 24px 14px;border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--panel);
  padding:16px;text-align:center;color:var(--muted);cursor:pointer;position:relative;
}
.identity-section .dropzone strong{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.identity-section .dropzone input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.identity-section .dropzone.disabled{opacity:.45;pointer-events:none}
.identity-actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 24px 8px}
.identity-actions .action-btn{flex:1;min-width:100px;min-height:40px}
.identity-note{min-height:18px;font-size:12.5px;color:var(--muted);margin:0 24px 16px}
.identity-layout{
  display:grid;grid-template-columns:minmax(260px,1fr) minmax(220px,280px);gap:18px;align-items:start;padding:0 0 12px;
}
.identity-section.wide .identity-layout{display:grid}
.card-stage{background:var(--soft);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;justify-content:center;margin:0 24px 16px 0}
.card-stage canvas{display:block;width:100%;max-width:260px;height:auto;background:#fff}
.identity-empty{display:flex;justify-content:center;padding:18px 24px 24px}
.identity-add{
  display:flex;flex-direction:column;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:var(--radius);
  background:var(--panel);padding:24px 40px;cursor:pointer;min-width:200px;font:inherit;
}
.identity-add:hover{background:var(--soft)}
.identity-add .plus{
  width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:20px;font-weight:700;
}
.identity-view{display:flex;justify-content:center;padding:8px 24px 24px}
.identity-view img{display:block;width:100%;max-width:220px;height:auto;border-radius:var(--radius);box-shadow:0 8px 24px #24232114}
@media(max-width:900px){
  .identity-layout{grid-template-columns:1fr}
  .card-stage{margin:0 24px 16px;order:-1}
}
</style></head>

    <main class="inx-main">
      <div class="page-header">
        <h1>Trash</h1>
        <button type="button" class="action-btn" id="empty-trash-btn" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" fill="currentColor" viewBox="0 0 48 48" aria-hidden="true"><path d="M33 3H15V9H6V12H9V42H24V39H12V22.5C12 16.701 16.701 12 22.5 12H36V24H39V12H42V9H33V3ZM30 9H18V6H30V9Z"></path><path d="M21 18V33H18V18H21Z"></path><path d="M30 24V18H27V24H30Z"></path><path d="M29.6317 43.7739L33.5208 39.8848L33.533 39.8726L33.5439 39.8617C34.7123 38.7179 36.5839 38.7208 37.7489 39.8703L37.7634 39.8849L41.6525 43.774L43.7738 41.6526L39.8846 37.7634L39.871 37.7498C38.7198 36.5838 38.7177 34.7095 39.8648 33.541C39.8715 33.5343 39.8782 33.5276 39.885 33.5209L43.774 29.6318L41.6527 27.5105L37.7389 31.4241C36.5655 32.5711 34.6844 32.563 33.521 31.3996L29.6319 27.5105L27.5104 29.6318L31.4083 33.5298C32.5644 34.6953 32.5681 36.5732 31.4195 37.7433L31.3993 37.7634L27.5103 41.6526L29.6317 43.7739Z"></path></svg>
          Empty Trash
        </button>

      <div class="workspace">
        <div class="contents-header">
          <span class="column-heading">Name</span>
          <span class="column-heading">Contents</span>
          <span class="column-heading">Updated</span>

  <div class="modal-overlay" id="empty-modal" role="dialog" aria-modal="true">
    <div class="modal">
      <h2>Empty Trash?</h2>
      <p>Permanently delete everything in Trash. This cannot be undone.</p>
      <div class="modal-actions">
        <button type="button" class="modal-btn" data-close>Cancel</button>
        <button type="button" class="modal-btn danger" id="empty-confirm">Empty Trash</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
const ICONS = {
  folder: '<svg class="icon" viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><path d="M21.9891 7L24.9891 14H45.5V41H3.5V7H21.9891ZM21.7252 14L20.0109 10H8C7.17157 10 6.5 10.6716 6.5 11.5V24C6.5 18.4772 10.9772 14 16.5 14H21.7252Z"/></svg>',
  pdf: '<svg class="icon" viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><path d="M10 23V6H26V18H38V23H41V15H29L29 3H7V23H10ZM29 7.24604L36.754 15H29V7.24604Z"/><path d="M32 27H41V30H35V33H40V36H35V41H32V27Z"/><path d="M7 27H11.5C12.8924 27 14.2277 27.5531 15.2123 28.5377C16.1969 29.5223 16.75 30.8576 16.75 32.25C16.75 33.6424 16.1969 34.9777 15.2123 35.9623C14.2277 36.9469 12.8924 37.5 11.5 37.5H10V41H7V27ZM10 34.5H11.5C12.0966 34.5 12.669 34.2627 13.091 33.841C13.5127 33.419 13.75 32.8466 13.75 32.25C13.75 31.6534 13.5127 31.081 13.091 30.659C12.669 30.2373 12.0966 30 11.5 30H10V34.5Z"/><path d="M23.5 27H19V41H23.5C25.2919 41 27.0083 40.2853 28.273 39.0207C29.5383 37.7553 30.25 36.0409 30.25 34.25C30.25 33.3726 30.079 32.4002 29.768 31.5008C29.4608 30.6121 28.9777 29.6818 28.273 28.977C27.0071 27.7112 25.2902 27 23.5 27ZM22 38V30H23.5C24.4946 30 25.4484 30.3951 26.1517 31.0983C26.4315 31.3782 26.7172 31.8578 26.9327 32.481C27.1445 33.0935 27.25 33.735 27.25 34.25C27.25 35.2439 26.8554 36.1956 26.1517 36.8993C25.4472 37.6038 24.4929 38 23.5 38H22Z"/></svg>',
  epub: '<svg class="icon" viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><path d="M41 3H7V45H41V3ZM27.5 42H10V6H14V24.1213L19 19.1213L24 24.1213V6H38V31.5C38 37.299 33.299 42 27.5 42Z"/></svg>',
  more: '<svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><circle cx="10" cy="24" r="3.5"/><circle cx="24" cy="24" r="3.5"/><circle cx="38" cy="24" r="3.5"/></svg>',
};

let items = [];
let selectedName = null;
let openMenu = null;

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function showToast(text, isError) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.style.background = isError ? "#8e332d" : "#242321";
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1800);
}
function joinTrash(name) {
  return "/Trash/" + name;
}
function fileIcon(item) {
  if (item.isDirectory) return ICONS.folder;
  if (item.isEpub) return ICONS.epub;
  return ICONS.pdf;
}
function displayName(item) {
  const name = item && item.name ? String(item.name) : "";
  if (item && item.isEpub) return name.replace(/\.epub$/i, "");
  return name;
}
function closeMenu() {
  if (openMenu) openMenu.remove();
  openMenu = null;
}
function openMore(button, item) {
  closeMenu();
  const menu = document.createElement("div");
  menu.className = "more-menu";
  menu.innerHTML =
    '<button type="button" data-action="restore">Restore</button>' +
    '<button type="button" class="danger" data-action="delete">Delete forever</button>';
  document.body.appendChild(menu);
  const rect = button.getBoundingClientRect();
  menu.style.top = Math.min(window.innerHeight - menu.offsetHeight - 8, rect.bottom + 4) + "px";
  menu.style.left = Math.max(8, rect.right - menu.offsetWidth) + "px";
  openMenu = menu;
  menu.querySelector('[data-action="restore"]').onclick = async () => {
    closeMenu();
    try {
      await restoreItem(item);
      showToast("Restored " + item.name, false);
      await loadTrash();
    } catch (e) {
      showToast(e.message || "Restore failed", true);
    }
  };
  menu.querySelector('[data-action="delete"]').onclick = async () => {
    closeMenu();
    if (!confirm('Permanently delete "' + item.name + '"?')) return;
    try {
      await permanentDelete(item);
      showToast("Deleted forever", false);
      await loadTrash();
    } catch (e) {
      showToast(e.message || "Delete failed", true);
    }
  };
}
async function permanentDelete(item) {
  const form = new FormData();
  form.append("path", joinTrash(item.name));
  form.append("type", item.isDirectory ? "folder" : "file");
  form.append("permanent", "1");
  const res = await fetch("/delete", { method: "POST", body: form });
  if (!res.ok) throw new Error((await res.text()) || "Delete failed");
}
async function restoreItem(item) {
  const form = new FormData();
  form.append("path", joinTrash(item.name));
  form.append("name", item.name);
  const res = await fetch("/api/trash/restore", { method: "POST", body: form });
  if (!res.ok) throw new Error((await res.text()) || "Restore failed");
}
function render() {
  const list = document.getElementById("trash-list");
  const emptyBtn = document.getElementById("empty-trash-btn");
  emptyBtn.disabled = !items.length;
  if (!items.length) {
    list.innerHTML = '<div class="empty-state">Trash is empty</div>';
    return;
  }
  const folders = items.filter((i) => i.isDirectory).sort((a, b) => a.name.localeCompare(b.name));
  const files = items.filter((i) => !i.isDirectory).sort((a, b) => a.name.localeCompare(b.name));
  const ordered = folders.concat(files);
  list.innerHTML = ordered
    .map((item) => {
      const contents = item.contents || (item.isDirectory ? "Folder" : "—");
      const updated = item.updated || "—";
      const selected = selectedName === item.name ? " selected" : "";
      return (
        '<div class="file-row' +
        (item.isDirectory ? " is-folder" : "") +
        selected +
        '" data-name="' +
        escapeHtml(item.name) +
        '">' +
        '<div class="row-main">' +
        fileIcon(item) +
        '<span class="name">' +
        escapeHtml(displayName(item)) +
        "</span></div>" +
        '<span class="row-contents">' +
        escapeHtml(contents) +
        "</span>" +
        '<span class="row-updated">' +
        escapeHtml(updated) +
        "</span>" +
        '<div class="row-actions"><button type="button" class="row-action more-btn" aria-label="More">' +
        ICONS.more +
        "</button></div></div>"
      );
    })
    .join("");

  list.querySelectorAll(".file-row").forEach((row) => {
    const item = ordered.find((i) => i.name === row.dataset.name);
    row.addEventListener("click", (e) => {
      if (e.target.closest(".more-btn")) return;
      selectedName = item.name;
      list.querySelectorAll(".file-row").forEach((r) => r.classList.toggle("selected", r === row));
    });
    row.querySelector(".more-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      openMore(e.currentTarget, item);
    });
  });
}
async function loadTrash() {
  const list = document.getElementById("trash-list");
  list.innerHTML = '<div class="empty-state">Loading…</div>';
  try {
    const res = await fetch("/api/files?path=" + encodeURIComponent("/Trash"));
    if (!res.ok) {
      // Trash folder may not exist yet
      items = [];
      render();
      return;
    }
    items = await res.json();
    render();
  } catch (e) {
    list.innerHTML = '<div class="empty-state">Unable to load Trash</div>';
  }
}
async function emptyTrash() {
  const btn = document.getElementById("empty-confirm");
  btn.disabled = true;
  try {
    const res = await fetch("/api/trash/empty", { method: "POST" });
    if (!res.ok) throw new Error((await res.text()) || "Failed to empty trash");
    showToast("Trash emptied", false);
    closeEmptyModal();
    await loadTrash();
  } catch (e) {
    showToast(e.message || "Failed", true);
  } finally {
    btn.disabled = false;
  }
}
function openEmptyModal() {
  document.getElementById("empty-modal").classList.add("open");
}
function closeEmptyModal() {
  document.getElementById("empty-modal").classList.remove("open");
}

document.getElementById("empty-trash-btn").addEventListener("click", openEmptyModal);
document.getElementById("empty-confirm").addEventListener("click", emptyTrash);
document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeEmptyModal));
document.getElementById("empty-modal").addEventListener("click", (e) => {
  if (e.target.id === "empty-modal") closeEmptyModal();
});
document.addEventListener("click", (e) => {
  if (openMenu && !e.target.closest(".more-menu") && !e.target.closest(".more-btn")) closeMenu();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeMenu();
    closeEmptyModal();
  }
});
loadTrash();
  </script>
