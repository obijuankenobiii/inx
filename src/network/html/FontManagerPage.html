<!doctype html>
<html lang="en">
<head><meta name="view-transition" content="same-origin"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Inx — Fonts</title>
  <style>
    .inx-section{margin:0 0 40px;max-width:720px}
    .inx-section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 10px}
    .inx-section-head h2{font:600 16px/1.2 var(--font-sans);letter-spacing:-.015em}
    .inx-section-head button{border:0;background:transparent;color:var(--ink);font:700 13px/1 var(--font-sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
    .font-drop{
      display:flex;flex-direction:column;align-items:flex-start;gap:10px;
      min-height:180px;padding:28px 30px;border:1.5px dashed #c8c1b3;background:var(--panel);
      cursor:pointer;transition:border-color .15s,background .15s;
    }
    .font-drop:hover,.font-drop.dragover{border-color:#8f887b;background:#fff}
    .font-drop h2{font:400 28px/1.2 var(--font-serif);letter-spacing:-.02em;margin:0;color:var(--ink)}
    .font-drop p{margin:0;font-size:14px;color:var(--muted);line-height:1.5;max-width:36em}
    .font-drop .browse{
      margin-top:8px;height:40px;padding:0 16px;border:1px solid var(--ink);background:transparent;
      color:var(--ink);font:700 13px/1 var(--font-sans);cursor:pointer;
    }
    .font-drop .browse:hover{background:var(--soft)}
    .font-drop input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    .install-panel{
      display:none;margin-top:18px;padding:20px 22px;border:1px solid var(--line);background:var(--panel);
    }
    .install-panel.open{display:block}
    .install-panel h3{font:600 15px/1.2 var(--font-sans);margin:0 0 6px}
    .install-meta{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.45}
    .install-meta strong{color:var(--ink);font-weight:600}
    .name-row{display:flex;gap:10px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
    .name-row label{font:600 13px/1 var(--font-sans);color:var(--ink)}
    .name-row input{
      flex:1;min-width:160px;height:40px;padding:0 12px;border:1px solid var(--line);
      background:#fff;font:400 15px/1.2 var(--font-sans);color:var(--ink);outline:none;
    }
    .name-row input:focus{border-color:var(--ink)}
    .style-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
    .style-chip{
      display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);
      background:var(--soft);font-size:12px;font-weight:600;color:var(--ink);
    }
    .style-chip span{color:var(--muted);font-weight:500}
    .install-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .primary{
      height:40px;padding:0 16px;border:1px solid var(--ink);background:var(--ink);color:#fff;
      font:700 13px/1 var(--font-sans);cursor:pointer;
    }
    .primary:disabled{opacity:.4;cursor:not-allowed}
    .ghost{
      height:40px;padding:0 14px;border:1px solid var(--line);background:transparent;color:var(--ink);
      font:700 13px/1 var(--font-sans);cursor:pointer;
    }
    .toggle-inline{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:13px;color:var(--muted)}
    .toggle-inline input{accent-color:var(--ink)}
    .progress{display:none;margin-top:14px}
    .progress.open{display:block}
    .progress-bar{height:3px;background:var(--line);overflow:hidden}
    .progress-fill{height:100%;width:0;background:var(--ink);transition:width .25s ease}
    .progress-text{margin-top:8px;font-size:12px;color:var(--muted)}
    .font-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
    .font-row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
    .font-name{font:600 15px/1.2 var(--font-sans)}
    .font-meta{font-size:12px;color:var(--muted);margin-top:3px}
    .font-actions{display:flex;gap:8px;flex:0 0 auto}
    .font-action{border:1px solid var(--line);background:transparent;color:var(--ink);height:34px;padding:0 12px;font:700 12px/1 var(--font-sans);cursor:pointer}
    .font-action.danger{color:#8e332d;border-color:#e2cfc8}
    .no-files{padding:18px 0;color:var(--muted);font-size:14px}
    .toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:10px 18px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
    .toast.show{opacity:1}
  </style>
<style id="inx-shell-css">
@view-transition{navigation:auto}
:root{
  --paper:#f7f5f0;--sidebar:#f3f1ec;--panel:#fffdfa;--ink:#242321;--muted:#77736c;
  --line:#dedbd3;--soft:#ebe7dd;--active:#e7e2d7;--blue:#2559f4;--blue-hover:#1142d4;--radius:2px;
  --color-highlighter-orange:#ff9f47;--danger:#8e332d;
  --font-sans:"Source Sans 3",system-ui,sans-serif;
  --font-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sidebar-w:250px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--font-sans);line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit}
a{color:inherit}

.inx-app-shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr)}
.inx-sidebar{
  position:sticky;top:0;align-self:start;height:100vh;max-height:100vh;
  background:var(--sidebar);border-right:1px solid var(--line);
  padding:26px 14px 14px;display:flex;flex-direction:column;gap:6px;overflow:hidden;
  view-transition-name:inx-sidebar;
}
::view-transition-old(inx-sidebar),
::view-transition-new(inx-sidebar){animation:none;mix-blend-mode:normal;height:100%}
.inx-brand{
  display:flex;align-items:center;gap:10px;padding:2px 12px 22px;text-decoration:none;color:var(--ink);
  font:600 23px/1 var(--font-sans);letter-spacing:-.045em;text-transform:lowercase;
}
.inx-brand .inx-mark{width:26px;height:26px;display:block;flex:0 0 auto}
.inx-side-nav{display:grid;gap:3px}
.inx-side-nav a,.inx-settings-link{
  display:flex;align-items:center;gap:12px;min-height:42px;padding:9px 12px;border-radius:var(--radius);
  text-decoration:none;font-size:15px;font-weight:500;color:var(--ink);
}
.inx-side-nav a:hover,.inx-settings-link:hover{background:var(--soft)}
.inx-side-nav a.active,.inx-settings-link.active{background:var(--active)}
.inx-side-nav svg,.inx-settings-link svg,.inx-recents-list svg{
  width:22px;height:22px;flex:0 0 auto;display:block;shape-rendering:geometricPrecision;
}
.inx-recents{margin-top:14px;padding:0 4px;min-height:0;overflow:auto}
.inx-recents-toggle{
  width:100%;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:8px 8px 6px;cursor:pointer;
}
.inx-recents-list{display:grid;gap:2px}
.inx-recents-list a{
  display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--radius);text-decoration:none;
  font-size:13px;font-weight:600;color:var(--ink);min-width:0;
}
.inx-recents-list a:hover{background:var(--soft)}
.inx-recents-list span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inx-recents-empty{padding:6px 8px 10px;font-size:12px;color:var(--muted)}
.inx-sidebar-end{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:10px}
.inx-corner-tray{
  position:fixed;right:18px;bottom:18px;z-index:50;width:auto;height:48px;display:flex;align-items:center;
  justify-content:center;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 6px 24px #24232118;
}
.inx-tray-btn{
  position:relative;width:40px;height:40px;border:0;border-radius:var(--radius);background:transparent;color:var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;
}
.inx-tray-btn:hover{background:var(--soft)}
.inx-tray-btn svg{width:20px;height:20px}
.inx-tray-tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;
  padding:6px 10px;border-radius:var(--radius);background:var(--ink);color:#fff;font-size:12px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .12s;
}
.inx-tray-btn:hover .inx-tray-tip,.inx-tray-btn:focus-visible .inx-tray-tip{opacity:1}

.inx-main{min-width:0;padding:28px clamp(22px,4vw,52px) 56px}
.inx-page-title{font:600 22px/1.2 var(--font-sans);letter-spacing:-.02em;margin:0 0 20px;color:var(--ink);font-weight:600}

/* Secondary legacy .container pages */
body.inx-shared .container{
  max-width:none;min-height:100vh;margin:0;padding:0;
  display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);
}
body.inx-shared .container>.inx-sidebar{grid-column:1;grid-row:1 / span 40}
body.inx-shared .header{
  grid-column:2;text-align:left;margin:0;padding:28px clamp(22px,4vw,52px) 0;background:var(--paper);border:0;
}
body.inx-shared .header h1{font:600 22px/1.2 var(--font-sans);letter-spacing:-.02em;color:var(--ink)}
body.inx-shared .nav-links{display:none!important}
body.inx-shared .container>:not(.inx-sidebar):not(.header){
  grid-column:2;max-width:1080px;width:100%;padding:18px clamp(22px,4vw,52px) 56px;background:var(--paper);
}
body.inx-shared .card,body.inx-shared .panel,body.inx-shared .stage{
  border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important;backdrop-filter:none;
  padding:0!important;margin:0 0 28px!important;
}
body.inx-shared .settings-section{
  border:1px solid var(--line);border-radius:0;box-shadow:none;background:var(--panel);backdrop-filter:none;
}
body.inx-shared .tabs{justify-content:flex-start;gap:8px;margin:0 0 18px;padding:0}
body.inx-shared .tab-btn{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);font-weight:600;
  padding:8px 16px;font-size:14px;
}
body.inx-shared .tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
body.inx-shared input,body.inx-shared select,body.inx-shared .btn,body.inx-shared .add-btn,body.inx-shared .action-btn,
body.inx-shared .new-tag-input,body.inx-shared .search,body.inx-shared .tag-input,body.inx-shared .icon-btn{
  border-radius:var(--radius)!important;font-family:var(--font-sans)!important;
}
body.inx-shared .btn.primary,body.inx-shared .btn-primary,body.inx-shared .add-btn{background:var(--ink);color:#fff;border-radius:var(--radius)}
body.inx-shared .action-btn{border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:700}
body.inx-shared .action-btn:hover{background:var(--soft)}
body.inx-shared .action-btn.icon-only-action,body.inx-shared .icon-only-action{
  border:0!important;background:transparent!important;box-shadow:none!important;
}
body.inx-shared .action-btn.icon-only-action:hover,body.inx-shared .icon-only-action:hover{
  background:transparent!important;opacity:.72;
}
body.inx-shared .primary-action,body.inx-shared .action-btn.primary-action{background:var(--blue);color:#fff;border-color:var(--blue)}
body.inx-shared .toast{border-radius:var(--radius)}
body.inx-shared .tag-pill{border-radius:var(--radius)!important;background:var(--soft)!important}
body.inx-shared .toggle-slider{border-radius:var(--radius)}
body.inx-shared .toggle-slider:before{border-radius:1px}
body.inx-shared input:checked+.toggle-slider{background:var(--ink)}
body.inx-shared .setting-item{border-bottom:1px solid var(--line)!important;padding:14px 18px!important}
body.inx-shared .section-header{padding:16px 18px 8px!important}
body.inx-shared .section-header h3{font:600 16px/1.2 var(--font-sans)!important;color:var(--ink)!important}
body.inx-shared .setting-label,.inx-shared .title,.inx-shared .book-title{font-family:var(--font-sans)!important;color:var(--ink)!important}
body.inx-shared .header{border:0!important}
body.inx-shared .toolbar .title{font:600 16px/1.2 var(--font-sans)}
body.inx-shared .summary{color:var(--muted)!important}

.inx-drawer-backdrop[hidden],
.inx-drawer[hidden]{
  display:none!important;
}
.inx-drawer-backdrop{
  display:block;position:fixed;inset:0;z-index:60;
  background:rgba(33,30,28,.72);
  opacity:0;pointer-events:none;
  transition:opacity .22s cubic-bezier(0,0,.2,1);
}
.inx-drawer-backdrop.is-open{
  opacity:1;pointer-events:auto;
}
.inx-drawer{
  display:flex;position:fixed;top:0;right:0;width:40vw;min-width:min(360px,100vw);max-width:720px;
  height:100vh;background:var(--panel);border-left:1px solid var(--line);z-index:70;
  padding:28px 40px 40px;overflow:auto;flex-direction:column;text-align:left!important;
  box-shadow:-18px 0 56px rgba(33,30,28,.38),-4px 0 18px rgba(33,30,28,.16);
  transform:translateX(100%);pointer-events:none;
  transition:transform .28s cubic-bezier(0,0,.2,1);
}
.inx-drawer.is-open{
  transform:translateX(0);pointer-events:auto;
}
.inx-drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px;text-align:left!important}
.inx-drawer-tabs{display:flex;gap:28px;justify-content:flex-start;flex:1}
.inx-drawer-tabs button{
  border:0;background:transparent;padding:8px 0;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;text-align:left;
}
.inx-drawer-tabs button.active{color:var(--ink);border-bottom-color:var(--blue)}
.inx-drawer-close{
  width:36px;height:36px;border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;
  color:var(--muted);flex:0 0 auto;z-index:2;position:relative;
}
.inx-drawer-close:hover{color:var(--ink)}
.inx-drawer-body,.inx-drawer-body *{text-align:left!important}
.inx-drawer-body{display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:0;min-height:120px;color:var(--ink)}
.inx-update{padding:0 0 28px;margin:0 0 28px;border-bottom:1px solid var(--line)}
.inx-update:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.inx-update-title{font:400 32px/1.2 var(--font-serif)!important;letter-spacing:-.02em;margin:0 0 10px;color:var(--ink)}
.inx-update-date{font-size:13px;color:var(--muted);margin:0 0 12px}
.inx-update p{font-size:15px;color:#4a4742;line-height:1.55;margin:0;max-width:36em}

@media(max-width:900px){
  .inx-app-shell,body.inx-shared .container{display:block}
  .inx-sidebar{
    position:relative;height:auto;max-height:none;padding:14px 12px;border-right:0;border-bottom:1px solid var(--line);
  }
  .inx-brand{padding:0 4px 10px;font-size:20px}
  .inx-brand .inx-mark{width:22px;height:22px}
  .inx-side-nav{display:flex;overflow:auto;gap:4px}
  .inx-side-nav a{min-height:38px;white-space:nowrap;font-size:14px}
  .inx-recents,.inx-sidebar-end .inx-settings-link span{display:none}
  .inx-sidebar-end{border-top:0;padding-top:0;display:flex;align-items:center;gap:8px}
  .inx-corner-tray{right:12px;bottom:12px}
  .inx-main,body.inx-shared .container>:not(.inx-sidebar):not(.header){padding:20px 16px 48px}
  body.inx-shared .header{padding:18px 16px 0}
  .inx-page-title,body.inx-shared .header h1{font-size:20px;margin-bottom:14px}
}

/* Device identity (Settings) */
.identity-section{padding-bottom:8px}
.identity-section .section-header{align-items:center}
.identity-section .field{display:grid;gap:6px;margin-bottom:14px;padding:0 24px}
.identity-section .field label{font-size:13px;font-weight:600;color:var(--muted)}
.identity-section .field input{
  width:100%;min-height:40px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);
  padding:8px 12px;
}
.identity-section .segmented{
  display:flex;gap:4px;margin:0 24px 14px;padding:3px;background:var(--soft);border-radius:var(--radius);
}
.identity-section .segmented button{
  flex:1;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:2px;
  font-size:13px;font-weight:600;cursor:pointer;
}
.identity-section .segmented button.active{background:var(--ink);color:#fff}
.identity-section .dropzone{
  display:block;margin:0 24px 14px;border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--panel);
  padding:16px;text-align:center;color:var(--muted);cursor:pointer;position:relative;
}
.identity-section .dropzone strong{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.identity-section .dropzone input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.identity-section .dropzone.disabled{opacity:.45;pointer-events:none}
.identity-actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 24px 8px}
.identity-actions .action-btn{flex:1;min-width:100px;min-height:40px}
.identity-note{min-height:18px;font-size:12.5px;color:var(--muted);margin:0 24px 16px}
.identity-layout{
  display:grid;grid-template-columns:minmax(260px,1fr) minmax(220px,280px);gap:18px;align-items:start;padding:0 0 12px;
}
.identity-section.wide .identity-layout{display:grid}
.card-stage{background:var(--soft);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;justify-content:center;margin:0 24px 16px 0}
.card-stage canvas{display:block;width:100%;max-width:260px;height:auto;background:#fff}
.identity-empty{display:flex;justify-content:center;padding:18px 24px 24px}
.identity-add{
  display:flex;flex-direction:column;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:var(--radius);
  background:var(--panel);padding:24px 40px;cursor:pointer;min-width:200px;font:inherit;
}
.identity-add:hover{background:var(--soft)}
.identity-add .plus{
  width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:20px;font-weight:700;
}
.identity-view{display:flex;justify-content:center;padding:8px 24px 24px}
.identity-view img{display:block;width:100%;max-width:220px;height:auto;border-radius:var(--radius);box-shadow:0 8px 24px #24232114}
@media(max-width:900px){
  .identity-layout{grid-template-columns:1fr}
  .card-stage{margin:0 24px 16px;order:-1}
}
</style></head>

    <main class="inx-main">
      <h1 class="inx-page-title">Fonts</h1>

      <section class="inx-section">
        <div class="font-drop" id="fontDropzone" tabindex="0" role="button" aria-label="Drop font files to install">
          <h2>Drop fonts to install</h2>
          <p>Drop a TTF/OTF file or a folder of styles. We detect the family name and convert to device bins automatically.</p>
          <button type="button" class="browse" id="browseFontsBtn">Browse files</button>
          <input id="fontFileInput" type="file" accept=".ttf,.otf,.TTF,.OTF" multiple>
          <input id="fontFolderInput" type="file" webkitdirectory directory multiple hidden>
        </div>

        <div class="install-panel" id="installPanel">
          <h3 id="installHeading">Ready to install</h3>
          <p class="install-meta" id="installMeta"></p>
          <div class="name-row">
            <label for="fontFamilyInput">Name</label>
            <input id="fontFamilyInput" autocomplete="off" spellcheck="false">
          </div>
          <div class="style-chips" id="styleChips"></div>
          <div class="install-actions">
            <button type="button" class="primary" id="installBtn">Install</button>
            <button type="button" class="ghost" id="clearInstallBtn">Clear</button>
            <label class="toggle-inline"><input id="fontOneBitToggle" type="checkbox"> 1-bit (sharper, no gray)</label>
          </div>
          <div class="progress" id="fontInstallProgressWrap">
            <div class="progress-bar"><div class="progress-fill" id="fontInstallProgressFill"></div></div>
            <div class="progress-text" id="fontInstallProgressText"></div>
          </div>
        </div>
      </section>

      <section class="inx-section">
        <div class="inx-section-head">
          <h2>Installed custom fonts</h2>
          <button type="button" onclick="loadInstalledFonts()">Refresh</button>
        </div>
        <div class="font-list" id="installedFontList"><div class="no-files">Loading…</div></div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script src="/js/inx_font_pack.js"></script>
  <script>
let pendingStyles = { regular: null, bold: null, italic: null, boldItalic: null };
let installing = false;

function showToast(msg, isError) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.background = isError ? "#8e332d" : "#242321";
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2400);
}
function fontSafeHtml(e) {
  return String(e || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function validFontName(name) {
  const n = String(name || "").trim();
  return n && n !== "." && n !== ".." && !/[\/:*?"<>|]/.test(n);
}
async function uploadBlobToPath(blob, filename, dest) {
  const fd = new FormData();
  fd.append("file", blob, filename);
  const res = await fetch("/upload?path=" + encodeURIComponent(dest === "/" ? "" : dest), { method: "POST", body: fd });
  if (!res.ok) throw new Error(await res.text());
}
async function mkdirQuiet(parent, name) {
  const fd = new FormData();
  fd.append("path", parent);
  fd.append("name", name);
  const res = await fetch("/mkdir", { method: "POST", body: fd });
  const text = await res.text();
  if (res.ok) return;
  if (res.status === 400 && text.includes("already")) return;
  throw new Error(text || "mkdir failed");
}
function isFontFile(file) {
  return file && /\.(ttf|otf)$/i.test(file.name || "");
}
async function walkEntry(entry, out) {
  if (!entry) return;
  if (entry.isFile) {
    await new Promise((resolve) => {
      entry.file((file) => {
        if (isFontFile(file)) out.push(file);
        resolve();
      }, () => resolve());
    });
    return;
  }
  if (entry.isDirectory) {
    const reader = entry.createReader();
    const readBatch = () =>
      new Promise((resolve) => {
        reader.readEntries(async (entries) => {
          if (!entries.length) return resolve();
          for (const child of entries) await walkEntry(child, out);
          await readBatch();
          resolve();
        }, () => resolve());
      });
    await readBatch();
  }
}
async function collectFontsFromList(fileList) {
  return Array.from(fileList || []).filter(isFontFile);
}
async function collectFontsFromDataTransfer(dt) {
  const files = [];
  if (dt && dt.items && dt.items.length) {
    const entries = [];
    for (let i = 0; i < dt.items.length; i++) {
      const item = dt.items[i];
      const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
      if (entry) entries.push(entry);
      else if (item.kind === "file") {
        const f = item.getAsFile();
        if (isFontFile(f)) files.push(f);
      }
    }
    for (const entry of entries) await walkEntry(entry, files);
    if (files.length) return files;
  }
  return collectFontsFromList(dt && dt.files);
}
async function groupFontFiles(files) {
  const styles = { regular: null, bold: null, italic: null, boldItalic: null };
  let label = "";
  for (const file of files) {
    const style = InxFontPack.guessStyleFromFilename(file.name);
    if (!styles[style]) styles[style] = file;
    if (!label) {
      label = (await InxFontPack.detectFamilyNameFromFile(file)) || file.name.replace(/\.[^.]+$/, "");
    }
  }
  if (!styles.regular) {
    styles.regular = styles.bold || styles.italic || styles.boldItalic;
  }
  return { label, styles };
}
function renderPending() {
  const panel = document.getElementById("installPanel");
  const chips = document.getElementById("styleChips");
  const meta = document.getElementById("installMeta");
  const input = document.getElementById("fontFamilyInput");
  const has = pendingStyles.regular || pendingStyles.bold || pendingStyles.italic || pendingStyles.boldItalic;
  panel.classList.toggle("open", !!has);
  if (!has) return;
  const labels = [
    ["regular", "Regular"],
    ["bold", "Bold"],
    ["italic", "Italic"],
    ["boldItalic", "Bold italic"],
  ];
  chips.innerHTML = labels
    .filter(([key]) => pendingStyles[key])
    .map(([key, title]) => '<div class="style-chip">' + title + " <span>" + fontSafeHtml(pendingStyles[key].name) + "</span></div>")
    .join("");
  const family = InxFontPack.sanitizeFamilyName(input.value || "CustomFont");
  meta.innerHTML = 'Installs to <strong>/fonts/' + fontSafeHtml(family) + '/</strong>';
}
async function stageFontFiles(files) {
  if (!window.InxFontPack) {
    showToast("Font packer missing — hard-refresh", true);
    return;
  }
  if (!files.length) {
    showToast("No TTF/OTF files found", true);
    return;
  }
  const grouped = await groupFontFiles(files);
  if (!grouped.styles.regular) {
    showToast("Need at least one font file", true);
    return;
  }
  pendingStyles = grouped.styles;
  document.getElementById("fontFamilyInput").value = grouped.label || "";
  document.getElementById("installHeading").textContent = "Ready to install";
  renderPending();
}
async function runInstall() {
  if (installing) return;
  if (!window.InxFontPack) return showToast("Font packer missing", true);
  const familyRaw = document.getElementById("fontFamilyInput").value;
  const family = InxFontPack.sanitizeFamilyName(familyRaw);
  if (!validFontName(family)) return showToast("Enter a valid font name", true);
  if (!pendingStyles.regular) return showToast("Add a Regular font file", true);

  installing = true;
  const btn = document.getElementById("installBtn");
  const wrap = document.getElementById("fontInstallProgressWrap");
  const fill = document.getElementById("fontInstallProgressFill");
  const text = document.getElementById("fontInstallProgressText");
  btn.disabled = true;
  wrap.classList.add("open");
  fill.style.width = "4%";
  text.textContent = "Packing…";

  try {
    const bins = await InxFontPack.buildAllBins({
      regular: pendingStyles.regular,
      bold: pendingStyles.bold,
      italic: pendingStyles.italic,
      boldItalic: pendingStyles.boldItalic,
      oneBit: !!document.getElementById("fontOneBitToggle").checked,
      onLog: function () {},
      onProgress: function (step, total, style, size) {
        const pct = total ? Math.min(92, Math.round(6 + 86 * step / total)) : 6;
        fill.style.width = pct + "%";
        text.textContent = "Packing " + style + " " + size + "px…";
      },
    });
    await mkdirQuiet("/", "fonts");
    await mkdirQuiet("/fonts", family);
    const dest = "/fonts/" + family;
    let uploaded = 0;
    for (let i = 0; i < bins.length; i++) {
      text.textContent = "Uploading " + bins[i].filename + "…";
      fill.style.width = String(Math.min(99, Math.round(92 + 7 * (i + 1) / bins.length))) + "%";
      await uploadBlobToPath(bins[i].blob, bins[i].filename, dest);
      uploaded++;
    }
    try {
      await fetch("/api/fonts/rescan", { method: "POST" });
    } catch (e) {}
    fill.style.width = "100%";
    text.textContent = "Installed " + uploaded + " files";
    showToast("Installed \"" + family + "\"");
    clearPending();
    await loadInstalledFonts();
  } catch (err) {
    text.textContent = "Failed";
    showToast(err.message || "Install failed", true);
  } finally {
    installing = false;
    btn.disabled = false;
    setTimeout(() => {
      wrap.classList.remove("open");
      fill.style.width = "0%";
      text.textContent = "";
    }, 1200);
  }
}
function clearPending() {
  pendingStyles = { regular: null, bold: null, italic: null, boldItalic: null };
  document.getElementById("fontFamilyInput").value = "";
  document.getElementById("installPanel").classList.remove("open");
  document.getElementById("styleChips").innerHTML = "";
}
function fontPath(name) {
  return "/fonts/" + name;
}
async function loadInstalledFonts() {
  const el = document.getElementById("installedFontList");
  if (!el) return;
  el.innerHTML = '<div class="no-files">Loading fonts...</div>';
  try {
    const res = await fetch("/api/files?path=" + encodeURIComponent("/fonts"));
    if (!res.ok) throw new Error(await res.text() || "Unable to read /fonts");
    const dirs = (await res.json()).filter((e) => e.isDirectory).sort((a, b) => String(a.name).localeCompare(String(b.name)));
    if (!dirs.length) {
      el.innerHTML = '<div class="no-files">No custom fonts installed.</div>';
      return;
    }
    el.innerHTML = dirs
      .map(
        (e) =>
          '<div class="font-row"><div><div class="font-name">' +
          fontSafeHtml(e.name) +
          '</div><div class="font-meta" id="fontMeta-' +
          encodeURIComponent(e.name) +
          '">Checking files...</div></div><div class="font-actions">' +
          '<button class="font-action" type="button" data-rename="' +
          encodeURIComponent(e.name) +
          '">Rename</button>' +
          '<button class="font-action danger" type="button" data-delete="' +
          encodeURIComponent(e.name) +
          '">Delete</button></div></div>'
      )
      .join("");
    dirs.forEach((e) => countFontFiles(e.name));
    el.querySelectorAll("[data-rename]").forEach((btn) => {
      btn.addEventListener("click", () => renameInstalledFont(btn.getAttribute("data-rename")));
    });
    el.querySelectorAll("[data-delete]").forEach((btn) => {
      btn.addEventListener("click", () => deleteInstalledFont(btn.getAttribute("data-delete")));
    });
  } catch (err) {
    el.innerHTML = '<div class="no-files">Unable to load fonts.</div>';
  }
}
async function countFontFiles(name) {
  const meta = document.getElementById("fontMeta-" + encodeURIComponent(name));
  if (!meta) return;
  try {
    const res = await fetch("/api/files?path=" + encodeURIComponent(fontPath(name)));
    const files = res.ok ? await res.json() : [];
    const n = files.filter((e) => !e.isDirectory && /\.bin$/i.test(e.name)).length;
    meta.textContent = n + " font file" + (n === 1 ? "" : "s");
  } catch (e) {
    meta.textContent = "Unable to read files";
  }
}
async function renameInstalledFont(encoded) {
  const oldName = decodeURIComponent(encoded);
  const next = prompt("Rename font folder", oldName);
  if (next === null) return;
  const name = window.InxFontPack ? InxFontPack.sanitizeFamilyName(next) : String(next || "").trim();
  if (!validFontName(name)) return alert("Enter a valid font name.");
  if (name === oldName) return;
  const fd = new FormData();
  fd.append("path", fontPath(oldName));
  fd.append("name", name);
  const res = await fetch("/rename", { method: "POST", body: fd });
  if (!res.ok) return alert((await res.text()) || "Rename failed");
  await fetch("/api/fonts/rescan", { method: "POST" }).catch(() => {});
  await loadInstalledFonts();
}
async function deleteFileOrFolder(path, type) {
  const fd = new FormData();
  fd.append("path", path);
  fd.append("type", type);
  fd.append("permanent", "1");
  const res = await fetch("/delete", { method: "POST", body: fd });
  if (!res.ok) throw new Error((await res.text()) || "Delete failed");
}
async function deleteFolderRecursive(path) {
  const res = await fetch("/api/files?path=" + encodeURIComponent(path));
  if (res.ok) {
    const items = await res.json();
    for (const item of items) {
      const child = path + "/" + item.name;
      if (item.isDirectory) await deleteFolderRecursive(child);
      else await deleteFileOrFolder(child, "file");
    }
  }
  await deleteFileOrFolder(path, "folder");
}
async function deleteInstalledFont(encoded) {
  const name = decodeURIComponent(encoded);
  if (!confirm('Delete custom font "' + name + '" and all .bin files inside it?')) return;
  try {
    await deleteFolderRecursive(fontPath(name));
    await fetch("/api/fonts/rescan", { method: "POST" }).catch(() => {});
    await loadInstalledFonts();
  } catch (err) {
    alert(err.message || "Delete failed");
  }
}

(function initFontDrop() {
  const zone = document.getElementById("fontDropzone");
  const fileInput = document.getElementById("fontFileInput");
  const browseBtn = document.getElementById("browseFontsBtn");
  browseBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    fileInput.click();
  });
  zone.addEventListener("click", (e) => {
    if (e.target === browseBtn || browseBtn.contains(e.target)) return;
    fileInput.click();
  });
  fileInput.addEventListener("change", async () => {
    const files = await collectFontsFromList(fileInput.files);
    fileInput.value = "";
    await stageFontFiles(files);
  });
  ["dragenter", "dragover"].forEach((ev) =>
    zone.addEventListener(ev, (e) => {
      e.preventDefault();
      zone.classList.add("dragover");
    })
  );
  ["dragleave", "drop"].forEach((ev) =>
    zone.addEventListener(ev, (e) => {
      e.preventDefault();
      zone.classList.remove("dragover");
    })
  );
  zone.addEventListener("drop", async (e) => {
    e.preventDefault();
    const files = await collectFontsFromDataTransfer(e.dataTransfer);
    await stageFontFiles(files);
  });
  document.getElementById("fontFamilyInput").addEventListener("input", renderPending);
  document.getElementById("installBtn").addEventListener("click", runInstall);
  document.getElementById("clearInstallBtn").addEventListener("click", clearPending);
  loadInstalledFonts();
})();
  </script>
